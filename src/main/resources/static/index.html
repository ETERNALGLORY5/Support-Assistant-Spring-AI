    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        #chat { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        .msg { margin: 8px 0; }
        .user { font-weight: bold; }
        .bot { color: #333; }
        input { width: 80%; padding: 8px; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
<h2>Helpdesk Assistant</h2>
<div id="chat"></div>
<input id="input" type="text" placeholder="Ask a question..." />
<button onclick="send()">Send</button>

<script>
    const conversationId = "web-" + Math.random().toString(36).substring(7);
    const chatDiv = document.getElementById("chat");
    const input = document.getElementById("input");

    async function send() {
        const message = input.value.trim();
        if (!message) return;
        input.value = "";

        appendMessage("user", message);
        const botMsgDiv = appendMessage("bot", "");

        const response = await fetch(`/chat/stream?conversationId=${conversationId}`, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: message
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });

            const lines = buffer.split("\n");
            buffer = lines.pop(); // keep incomplete last line for next chunk

            for (const line of lines) {
                if (line.startsWith("data:")) {
                    const content = line.slice(5); // remove "data:" prefix
                    botMsgDiv.textContent += content;
                    chatDiv.scrollTop = chatDiv.scrollHeight;
                }
            }
        }
    }

    function appendMessage(role, text) {
        const div = document.createElement("div");
        div.className = "msg " + role;
        div.textContent = (role === "user" ? "You: " : "Assistant: ") + text;
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
        return div;
    }

    input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") send();
    });
</script>
</body>
